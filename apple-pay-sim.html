!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Pay | Blanchimax</title>
<style>
:root {
--bg-color: #000000;
--sheet-bg: #1c1c1e;
--border-color: #2c2c2e;
--text-primary: #ffffff;
--text-secondary: #8e8e93;
--accent-blue: #0a84ff;
--success-green: #30d158;
}

body {
background-color: var(--bg-color);
color: var(--text-primary);
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
margin: 0;
padding: 0;
display: flex;
flex-direction: column;
justify-content: flex-end;
min-height: 100vh;
user-select: none;
}

.sheet {
background-color: var(--sheet-bg);
border-top-left-radius: 20px;
border-top-right-radius: 20px;
padding: 20px 20px 35px;
box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
animation: slideUp 0.3s ease-out;
}

@keyframes slideUp {
from { transform: translateY(100%); }
to { transform: translateY(0); }
}

.sheet-header {
display: flex;
justify-content: space-between;
align-items: center;
padding-bottom: 15px;
border-bottom: 1px solid var(--border-color);
}

.apple-logo {
font-size: 1.4rem;
font-weight: 600;
letter-spacing: -0.5px;
}

.close-btn {
background: #2c2c2e;
color: var(--text-secondary);
border: none;
width: 28px;
height: 28px;
border-radius: 50%;
font-size: 1rem;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
}

.row {
display: flex;
justify-content: space-between;
align-items: flex-start;
padding: 14px 0;
border-bottom: 1px solid var(--border-color);
font-size: 0.9rem;
}

.row-label {
color: var(--text-secondary);
width: 32%;
text-transform: uppercase;
font-size: 0.75rem;
letter-spacing: 0.5px;
padding-top: 2px;
}

.row-value {
width: 68%;
line-height: 1.4;
}

.card-badge {
display: inline-block;
background: linear-gradient(135deg, #7b2cbf, #3c096c);
padding: 2px 8px;
border-radius: 4px;
font-size: 0.75rem;
font-weight: bold;
margin-right: 6px;
}

.total-row {
display: flex;
justify-content: space-between;
align-items: center;
padding: 18px 0 25px;
}

.total-label {
color: var(--text-secondary);
font-size: 0.85rem;
text-transform: uppercase;
}

.total-amount {
font-size: 1.6rem;
font-weight: 700;
}

.auth-zone {
text-align: center;
padding-top: 10px;
}

.pay-btn {
background-color: var(--accent-blue);
color: white;
border: none;
width: 100%;
padding: 15px;
border-radius: 12px;
font-size: 1rem;
font-weight: 600;
cursor: pointer;
transition: opacity 0.2s, transform 0.1s;
}

.pay-btn:active {
transform: scale(0.98);
}

.status-box {
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 15px 0;
}

.spinner {
width: 36px;
height: 36px;
border: 3px solid rgba(255, 255, 255, 0.2);
border-top-color: var(--accent-blue);
border-radius: 50%;
animation: spin 0.8s linear infinite;
margin-bottom: 10px;
}

@keyframes spin {
to { transform: rotate(360deg); }
}

.checkmark {
width: 44px;
height: 44px;
border-radius: 50%;
background-color: var(--success-green);
color: black;
font-size: 1.5rem;
font-weight: bold;
display: none;
align-items: center;
justify-content: center;
margin-bottom: 10px;
animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popIn {
from { transform: scale(0); }
to { transform: scale(1); }
}

.status-text {
font-size: 0.95rem;
font-weight: 500;
color: var(--text-primary);
}
</style>
</head>
<body>

<div class="sheet">
<div class="sheet-header">
<div class="apple-logo"> Pay</div>
<button class="close-btn" onclick="window.close()" title="Annuler">✕</button>
</div>

<div class="row">
<div class="row-label">Carte</div>
<div class="row-value">
<span class="card-badge">VISA</span> •••• 4242
</div>
</div>

<div class="row">
<div class="row-label">Livraison</div>
<div class="row-value" id="shipping-info">
Adresse enregistrée sur le compte<br>
<span style="color: var(--text-secondary); font-size: 0.8rem;">Livraison Standard (Gratuite)</span>
</div>
