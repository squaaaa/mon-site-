<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialisation du mot de passe | Blanchimax</title>
<style>
:root {
--primary-color: #7b2cbf;
--accent-color: #ff4d4d;
--bg-color: #0a0a0a;
--text-color: #ffffff;
--card-bg: #1a1a1a;
--success-color: #2ecc71;
}

body {
background-color: var(--bg-color);
color: var(--text-color);
font-family: 'Segoe UI', sans-serif;
margin: 0;
padding: 20px;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
box-sizing: border-box;
}

.card {
background-color: var(--card-bg);
padding: 35px;
border-radius: 18px;
border: 1px solid #333;
max-width: 420px;
width: 100%;
box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
}

h1 {
margin-top: 0;
font-size: 1.5rem;
text-align: center;
letter-spacing: 1px;
}

.brand {
color: var(--primary-color);
text-transform: uppercase;
font-weight: bold;
font-size: 0.85rem;
text-align: center;
margin-bottom: 8px;
letter-spacing: 2px;
}

.email-info {
background: #111;
border: 1px solid #2b2b2b;
padding: 10px 14px;
border-radius: 8px;
font-size: 0.85rem;
color: #bbb;
margin-bottom: 20px;
word-break: break-all;
}

.input-field {
width: 100%;
padding: 12px;
background: #000;
border: 1px solid #333;
color: white;
border-radius: 8px;
margin-bottom: 12px;
box-sizing: border-box;
font-family: monospace;
font-size: 0.95rem;
}

.input-error {
border-color: var(--accent-color) !important;
}

.btn {
background: var(--primary-color);
color: white;
padding: 15px 25px;
width: 100%;
border-radius: 50px;
font-weight: bold;
border: none;
cursor: pointer;
text-transform: uppercase;
transition: opacity 0.2s, transform 0.1s;
margin-top: 8px;
}

.btn:hover {
opacity: 0.92;
}

.btn:active {
transform: scale(0.99);
}

.error-msg {
color: var(--accent-color);
font-size: 0.8rem;
margin-bottom: 10px;
display: none;
font-weight: bold;
}

.success-box {
display: none;
text-align: center;
padding: 15px 0;
}

.success-text {
color: var(--success-color);
font-weight: bold;
margin-bottom: 18px;
font-size: 0.95rem;
}

.back-link {
display: block;
text-align: center;
margin-top: 20px;
color: var(--primary-color);
text-decoration: underline;
font-size: 0.85rem;
cursor: pointer;
}
</style>
</head>
<body>
<div class="card">
<div class="brand">Blanchimax</div>
<h1>Nouveau mot de passe</h1>

<div class="email-info" id="email-display">
Compte concerné : <strong>chargement...</strong>
</div>

<form id="reset-form" onsubmit="handleReset(event)">
<input type="password" id="new-pass" class="input-field" placeholder="Nouveau mot de passe (min. 4 caractères)" required>
<input type="password" id="confirm-pass" class="input-field" placeholder="Confirmer le mot de passe" required>

<div id="error-msg" class="error-msg">Les mots de passe ne correspondent pas ou sont trop courts.</div>

<button type="submit" class="btn">Enregistrer le mot de passe</button>
</form>

<div id="success-box" class="success-box">
<div class="success-text">Mot de passe mis à jour avec succès !</div>
<button class="btn" onclick="goBack()">Retour à la boutique</button>
</div>

<a class="back-link" onclick="goBack()">Annuler et revenir sur Blanchimax</a>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const targetEmail = params.get('email') || '';
const emailDisplay = document.getElementById('email-display');

if (targetEmail) {
emailDisplay.innerHTML = `Compte concerné : <strong>${escapeHtml(targetEmail)}</strong>`;
} else {
emailDisplay.innerHTML = `<span style="color: var(--accent-color);">Aucun email détecté dans le lien.</span>`;
}

function escapeHtml(str) {
return str.replace(/[&<>"']/g, function (match) {
const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
return map[match];
});
}

function handleReset(event) {
event.preventDefault();

const newPassInput = document.getElementById('new-pass');
const confirmPassInput = document.getElementById('confirm-pass');
const errorMsg = document.getElementById('error-msg');

const pass1 = newPassInput.value;
const pass2 = confirmPassInput.value;

newPassInput.classList.remove('input-error');
confirmPassInput.classList.remove('input-error');
errorMsg.style.display = 'none';

if (!targetEmail) {
errorMsg.innerText = "Lien invalide : email manquant.";
errorMsg.style.display = 'block';
return;
}

if (pass1.length < 4 || pass1 !== pass2) {
newPassInput.classList.add('input-error');
confirmPassInput.classList.add('input-error');
errorMsg.innerText = "Les mots de passe doivent être identiques (4 caractères minimum).";
errorMsg.style.display = 'block';
return;
}

const users = JSON.parse(localStorage.getItem('users') || '[]');
const userIndex = users.findIndex(u => u.email.toLowerCase() === targetEmail.toLowerCase());

if (userIndex === -1) {
errorMsg.innerText = "Aucun compte trouvé pour cet email dans le navigateur.";
errorMsg.style.display = 'block';
return;
}

users[userIndex].pass = pass1;
localStorage.setItem('users', JSON.stringify(users));

document.getElementById('reset-form').style.display = 'none';
document.getElementById('success-box').style.display = 'block';
}

function goBack() {
if (window.opener && !window.opener.closed) {
window.opener.focus();
}
window.location.href = 'index.html';
}
</script>
</body>
</html>
